name: 更新市场索引

on:
  schedule:
    # 每 6 小时刷新一次：新版本发布后最迟 6 小时进入索引
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "plugins.json"
      - "icons/**"
      - "scripts/**"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装官方索引校验器
        run: npm install --no-save @deepseek-ai/dsh-plugin-market-index

      - name: 生成并校验 index.json
        run: node scripts/build-index.mjs

      - name: 有变化则提交
        run: |
          if git diff --quiet -- index.json; then
            echo "索引无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: 刷新市场索引（npm latest）"
          git push
