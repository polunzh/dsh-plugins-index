  <rect x="9" y="5.5" width="3.9" height="3.9" rx="1.17" fill="#14161a"/>
  <rect x="14.1" y="5.5" width="3.9" height="3.9" rx="1.17" fill="#14161a"/>
  <rect x="9" y="10.6" width="3.9" height="3.9" rx="1.17" fill="#14161a"/>
  <rect x="14.1" y="10.6" width="3.9" height="3.9" rx="1.17" fill="#3d8ee6"/>
  <g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="25" y="14" textLength="72.1" lengthAdjust="spacingAndGlyphs">DSH 插件索引</text>
    <text x="109.1" y="14" textLength="33" lengthAdjust="spacingAndGlyphs">已收录</text>
